# Parcours reproduit sur le téléphone virtuel de la CI : connexion, mode mission, « Client introuvable (no-show) ».
# Plantage signalé par l'utilisateur (application fermée par Android) après ce geste.
appId: com.clicab.driver
---
- launchApp:
    clearState: true
    permissions:
      notifications: unset
- extendedWaitUntil:
    visible:
      id: ".*:id/permission_allow_button"
    timeout: 15000
- tapOn:
    id: ".*:id/permission_allow_button"
# Connexion hybride : le lien du serveur est en bas de l'écran et porte l'étiquette « Changer le serveur ».
- extendedWaitUntil:
    visible: "(?i)bienvenue"
    timeout: 20000
# L'appui pouvait tomber pendant le défilement et ne rien ouvrir (passage 45911807846) : jusqu'à 3 essais.
- repeat:
    times: 3
    while:
      notVisible: "(?i)adresse du serveur"
    commands:
      - scrollUntilVisible:
          element: "Changer le serveur"
          direction: DOWN
      - waitForAnimationToEnd
      - tapOn: "Changer le serveur"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "(?i)adresse du serveur"
    timeout: 10000
- tapOn: "https://api.clicab.fr"
- eraseText: 40
- inputText: "http://10.0.2.2:3000"
- pressKey: Enter  # ferme le clavier (la touche Retour mettait parfois l'application en arrière-plan)
- takeScreenshot: 0-serveur
- extendedWaitUntil:
    visible: "(?i)enregistrer"
    timeout: 10000
- tapOn: "(?i)enregistrer"
# Le texte « Serveur : … » est masqué par l'étiquette d'accessibilité du lien : on vérifie que le lien est revenu.
- extendedWaitUntil:
    visible: "Changer le serveur"
    timeout: 10000
- scrollUntilVisible:
    element: "06 12 34 56 78"
    direction: UP
- tapOn: "06 12 34 56 78"
- inputText: "0611223355"
- pressKey: Enter  # ferme le clavier (la touche Retour mettait parfois l'application en arrière-plan)
# Chauffeur de test non activé (pas de mot de passe) : connexion par code SMS de l'ancien parcours.
- scrollUntilVisible:
    element: "(?i)ancien compte.*"
    direction: DOWN
- tapOn: "(?i)ancien compte.*"
- tapOn: "••••••"
- inputText: "000000"
- pressKey: Enter  # ferme le clavier (la touche Retour mettait parfois l'application en arrière-plan)
- tapOn: "C'est parti"
- tapOn:
    text: "(?i)(While using the app|Only this time|Allow|Autoriser.*)"
    optional: true
- takeScreenshot: 1-connecte
- tapOn: "(?i)agenda"
- tapOn: "(?i)ouvrir le mode mission"
- tapOn:
    text: "(?i)(While using the app|Only this time|Allow|Autoriser.*)"
    optional: true
- takeScreenshot: 2-mode-mission
# La carte Google sans clé plantait ~10 s après l'ouverture : on attend pour s'assurer que le mode mission tient.
- extendedWaitUntil:
    notVisible: "(?i)xxxxxxxx-jamais-affiche"
    timeout: 15000
- takeScreenshot: 2b-mode-mission-apres-15s
- scrollUntilVisible:
    element: "(?i)un souci.*"
    direction: DOWN
- tapOn: "(?i)un souci.*"
- scrollUntilVisible:
    element: "(?i)client introuvable.*"
    direction: DOWN
- takeScreenshot: 3-avant-no-show
- tapOn: "(?i)client introuvable.*"
# Le titre « Client absent » est en haut de la fiche, sortie de l'écran par le défilement vers le bouton : on remonte.
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Client absent"
    direction: UP
    timeout: 15000
- takeScreenshot: 4-apres-no-show
