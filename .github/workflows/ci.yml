name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vtc
          POSTGRES_PASSWORD: vtc
          POSTGRES_DB: vtc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vtc" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vtc:vtc@localhost:5432/vtc_test?schema=public
      DATABASE_URL: postgresql://vtc:vtc@localhost:5432/vtc_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @vtc/api exec prisma migrate deploy
      # Le client Prisma doit exister avant la compilation (sinon : « no exported member 'Booking' »).
      - run: pnpm -F @vtc/api exec prisma generate
      - run: pnpm -r build
      - run: pnpm typecheck
      - run: pnpm test

  # Construit les 3 images et, sur la branche de travail ou main, les publie sur ghcr.io : le gestionnaire Docker de hPanel
  # ne sait pas construire d'images, il télécharge seulement des images toutes faites (paquets publics, choix de l'utilisateur).
  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH_PILOT: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/claude/optimistic-maxwell-sagq8e' || github.ref == 'refs/heads/main') }}
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/claude/optimistic-maxwell-sagq8e' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/crm-sav') }}
      REGISTRY: ghcr.io/sniper4194
      API_URL: ${{ vars.API_URL || 'https://api.clicab.fr' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion au registre GitHub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/clicab-api:${{ github.sha }}
            ${{ env.PUBLISH_PILOT == 'true' && format('{0}/clicab-api:pilote', env.REGISTRY) || '' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Image back-office
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backoffice/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/clicab-backoffice:${{ github.sha }}
            ${{ env.PUBLISH_PILOT == 'true' && format('{0}/clicab-backoffice:pilote', env.REGISTRY) || '' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: NEXT_PUBLIC_API_URL=${{ env.API_URL }}
          cache-from: type=gha,scope=backoffice
          cache-to: type=gha,mode=max,scope=backoffice
      - name: Image page de suivi voyageur
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web-booking/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/clicab-suivi:${{ github.sha }}
            ${{ env.PUBLISH_PILOT == 'true' && format('{0}/clicab-suivi:pilote', env.REGISTRY) || '' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: NEXT_PUBLIC_API_URL=${{ env.API_URL }}
          cache-from: type=gha,scope=web-booking
          cache-to: type=gha,mode=max,scope=web-booking
