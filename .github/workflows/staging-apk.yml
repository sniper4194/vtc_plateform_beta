name: APK CliCab TEST (préproduction)
on:
  push:
    branches: [staging/clicab]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    if: github.ref == 'refs/heads/staging/clicab'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_CLICAB_TEST: "1"
      EXPO_PUBLIC_API_URL: https://api-test.clicab.fr
      ALLOW_CLEARTEXT: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      - name: Vérifier et générer le projet Android distinct
        working-directory: apps/driver-app
        run: |
          pnpm typecheck
          npx expo config --type public --json > /tmp/clicab-test-config.json
          node -e "const c=require('/tmp/clicab-test-config.json');if(c.android.package!=='com.clicab.driver.test'||c.name!=='CliCab TEST')process.exit(1)"
          npx expo prebuild --platform android --no-install
      - name: Compiler APK
        working-directory: apps/driver-app/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Vérifier identifiant APK
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          APK=$(find apps/driver-app/android/app/build/outputs/apk/release -name '*.apk' | head -1)
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.clicab.driver.test'"
          cp "$APK" clicab-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: clicab-test-apk
          path: clicab-test.apk
          if-no-files-found: error
