# UNIQUEMENT sur un VPS distinct de la production. Aucun volume externe.
name: clicab-staging
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vtc
      POSTGRES_DB: clicab_staging
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?secret staging requis}
    volumes: [staging_db:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U vtc -d clicab_staging"]
      interval: 5s
      timeout: 5s
      retries: 12
  api:
    image: ghcr.io/sniper4194/clicab-api:staging-${STAGING_SHA:?SHA staging requis}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      APP_ENV: staging
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://vtc:${STAGING_POSTGRES_PASSWORD}@db:5432/clicab_staging?schema=public
      TOKEN_SECRET: ${STAGING_TOKEN_SECRET:?secret staging requis}
      SMS_PROVIDER: console
      EMAIL_PROVIDER: console
      CRM_EMAIL_ENABLED: "0"
      TRUST_PROXY: "1"
      BRAND_NAME: CliCab TEST
      CORS_ORIGINS: https://admin-test.clicab.fr,https://suivi-test.clicab.fr
      TRACKING_BASE_URL: https://suivi-test.clicab.fr
      IDENTITY_CHECKS: "0"
      IDENTITY_SPOT: "0"
      VEHICLE_RULES: "0"
      AIRPORT_BADGE_REQUIRED: ${AIRPORT_BADGE_REQUIRED:-1}
    networks: [private]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options: {max-size: "5m",max-file: "2"}
  backoffice:
    image: ghcr.io/sniper4194/clicab-backoffice:staging-${STAGING_SHA:?SHA staging requis}
    restart: unless-stopped
    networks: [private]
    depends_on:
      api: {condition: service_healthy}
  web-booking:
    image: ghcr.io/sniper4194/clicab-suivi:staging-${STAGING_SHA:?SHA staging requis}
    restart: unless-stopped
    networks: [private]
    depends_on:
      api: {condition: service_healthy}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80","443:443"]
    configs:
      - source: staging_caddy
        target: /etc/caddy/Caddyfile
    volumes: [staging_tls:/data,staging_caddy_config:/config]
    networks: [private,edge]
    depends_on: [api,backoffice,web-booking]
configs:
  staging_caddy:
    content: |
      (staging) {
        header X-Robots-Tag "noindex, nofollow"
        header X-CliCab-Environment "staging"
        header Referrer-Policy "no-referrer"
        @blocked not remote_ip ${STAGING_ALLOWED_IPS:?adresses IP de test requises}
        respond @blocked "Accès préproduction restreint" 403
      }
      api-test.clicab.fr {
        import staging
        reverse_proxy api:3000
      }
      admin-test.clicab.fr {
        import staging
        reverse_proxy backoffice:3001
      }
      suivi-test.clicab.fr {
        import staging
        reverse_proxy web-booking:3002
      }
networks:
  private:
    internal: true
  edge:
volumes:
  staging_db:
  staging_tls:
  staging_caddy_config:
