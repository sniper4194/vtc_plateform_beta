# Déploiement sur un VPS Hostinger SANS accès au dépôt cloné : un seul fichier, collé dans le gestionnaire Docker de hPanel
# (VPS > Gestionnaire Docker > Composer) ou envoyé par l'API Hostinger. Généré par `node infra/make-vps-compose.mjs` : ne pas modifier à la main
# (modifier docker-compose.vps.template.yml, Caddyfile.vps ou backup.sh puis relancer le script).
#
# Variables à renseigner dans le gestionnaire (jamais dans ce fichier) :
#   Les images sont construites par GitHub (CI) et publiées sur ghcr.io/sniper4194 : hPanel ne sait pas construire d'images.
#   IMAGE_TAG (facultatif) : « pilote » par défaut (dernière version testée), ou l'empreinte d'un commit pour revenir en arrière.
#   API_DOMAIN, ADMIN_DOMAIN, TRACK_DOMAIN, POSTGRES_PASSWORD, TOKEN_SECRET (+ fournisseurs SMS / e-mail : voir docs/DEPLOIEMENT.md)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: vtc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: vtc
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtc -d vtc"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/sniper4194/clicab-api:${IMAGE_TAG:-pilote}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://vtc:${POSTGRES_PASSWORD}@db:5432/vtc?schema=public
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET requis (openssl rand -hex 32)}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGINS: https://${ADMIN_DOMAIN:?ADMIN_DOMAIN requis},https://${TRACK_DOMAIN:?TRACK_DOMAIN requis}
      TRACKING_BASE_URL: https://${TRACK_DOMAIN}
      TRUST_PROXY: "1"
      ROUTING_URL: ${ROUTING_URL:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      OVH_APP_KEY: ${OVH_APP_KEY:-}
      OVH_APP_SECRET: ${OVH_APP_SECRET:-}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY:-}
      OVH_SMS_SERVICE: ${OVH_SMS_SERVICE:-}
      OVH_SMS_SENDER: ${OVH_SMS_SENDER:-}
      INFOBIP_BASE_URL: ${INFOBIP_BASE_URL:-}
      INFOBIP_API_KEY: ${INFOBIP_API_KEY:-}
      INFOBIP_FROM: ${INFOBIP_FROM:-}
      BRAND_NAME: ${BRAND_NAME:-CliCab}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PRICE_LADDER: ${PRICE_LADDER:-1}
      ECO_BONUS_PERCENT: ${ECO_BONUS_PERCENT:-}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
      CONTROL_TOWER_PHONE: ${CONTROL_TOWER_PHONE:-}
      IDENTITY_CHECKS: ${IDENTITY_CHECKS:-1}
      IDENTITY_SPOT: ${IDENTITY_SPOT:-1}
      VEHICLE_RULES: ${VEHICLE_RULES:-1}
      AIRPORT_BADGE_ENABLED: ${AIRPORT_BADGE_ENABLED:-1}
      AIRPORT_BADGE_ZONES: ${AIRPORT_BADGE_ZONES-CDG,ORLY,BEAUVAIS}
    expose: ["3000"]

  backoffice:
    image: ghcr.io/sniper4194/clicab-backoffice:${IMAGE_TAG:-pilote}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: [api]
    expose: ["3001"]

  web-booking:
    image: ghcr.io/sniper4194/clicab-suivi:${IMAGE_TAG:-pilote}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: [api]
    expose: ["3002"]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: vtc
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: vtc
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["sh", "/backup.sh"]
    configs:
      - source: backup_sh
        target: /backup.sh
    volumes: [backups:/backups]

  backup-check:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: vtc
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: vtc
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
      BACKUP_CHECK_INTERVAL_HOURS: ${BACKUP_CHECK_INTERVAL_HOURS:-168}
    entrypoint: ["sh", "/backup-check.sh"]
    configs:
      - source: backup_check_sh
        target: /backup-check.sh
      - source: restore_drill_sh
        target: /restore-drill.sh
    volumes: [backups:/backups:ro]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on: [api, backoffice, web-booking]
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      TRACK_DOMAIN: ${TRACK_DOMAIN}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes: [caddy_data:/data, caddy_config:/config]

configs:
  caddyfile:
    content: |
__CADDYFILE__
  backup_sh:
    content: |
__BACKUP__
  backup_check_sh:
    content: |
__CHECK__
  restore_drill_sh:
    content: |
__RESTORE__

volumes:
  dbdata:
  backups:
  caddy_data:
  caddy_config:
