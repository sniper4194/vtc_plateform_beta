# Pré-production / petite production sur un seul serveur.
#   cp infra/.env.prod.example infra/.env.prod   (puis renseigner les secrets)
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: vtc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: vtc
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vtc -d vtc"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Aucun port publié : la base n'est joignable que par l'API.

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://vtc:${POSTGRES_PASSWORD}@db:5432/vtc?schema=public
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET requis (openssl rand -hex 32)}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGINS: https://${ADMIN_DOMAIN:?ADMIN_DOMAIN requis},https://${TRACK_DOMAIN:?TRACK_DOMAIN requis}
      # Adresse publique de la page de suivi voyageur : sert à fabriquer le lien envoyé par SMS et e-mail.
      TRACKING_BASE_URL: https://${TRACK_DOMAIN}
      TRUST_PROXY: "1"
      ROUTING_URL: ${ROUTING_URL:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      OVH_APP_KEY: ${OVH_APP_KEY:-}
      OVH_APP_SECRET: ${OVH_APP_SECRET:-}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY:-}
      OVH_SMS_SERVICE: ${OVH_SMS_SERVICE:-}
      OVH_SMS_SENDER: ${OVH_SMS_SENDER:-}
      INFOBIP_BASE_URL: ${INFOBIP_BASE_URL:-}
      INFOBIP_API_KEY: ${INFOBIP_API_KEY:-}
      INFOBIP_FROM: ${INFOBIP_FROM:-}
      BRAND_NAME: ${BRAND_NAME:-CliCab}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      PRICE_LADDER: ${PRICE_LADDER:-1}
      ECO_BONUS_PERCENT: ${ECO_BONUS_PERCENT:-}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
      LADDER_START_RATIO: ${LADDER_START_RATIO:-0.85}
      LADDER_FROM_MIN: ${LADDER_FROM_MIN:-1440}
      LADDER_TO_MIN: ${LADDER_TO_MIN:-60}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      IDENTITY_CHECKS: ${IDENTITY_CHECKS:-1}
      IDENTITY_SPOT: ${IDENTITY_SPOT:-1}
      VEHICLE_RULES: ${VEHICLE_RULES:-1}
    expose: ["3000"]

  backoffice:
    build:
      context: ..
      dockerfile: apps/backoffice/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?API_DOMAIN requis}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: [api]
    expose: ["3001"]

  # Page de suivi du voyageur (lien reçu par SMS et e-mail).
  web-booking:
    build:
      context: ..
      dockerfile: apps/web-booking/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: [api]
    expose: ["3002"]

  # Sauvegarde automatique de la base (voir infra/backup.sh et docs/DEPLOIEMENT.md : à copier aussi hors du serveur).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: vtc
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: vtc
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    entrypoint: ["sh", "/backup.sh"]
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups

  # Contrôle hebdomadaire des sauvegardes : restaure la plus récente dans une base temporaire et alerte (ERROR_WEBHOOK_URL) en cas d'échec.
  backup-check:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: vtc
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: vtc
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
      BACKUP_CHECK_INTERVAL_HOURS: ${BACKUP_CHECK_INTERVAL_HOURS:-168}
    entrypoint: ["sh", "/backup-check.sh"]
    volumes:
      - ./backup-check.sh:/backup-check.sh:ro
      - ./restore-drill.sh:/restore-drill.sh:ro
      - backups:/backups:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on: [api, backoffice, web-booking]
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      TRACK_DOMAIN: ${TRACK_DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN requis}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dbdata:
  backups:
  caddy_data:
  caddy_config:
